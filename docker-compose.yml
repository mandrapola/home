services:
  server:
    build:
      context: ./php-app
      dockerfile: Dockerfile
    container_name: server
    ports:
      - "3000:80"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=smarthome
      - DB_USER=smarthome
      - DB_PASSWORD=smarthome
      - PROXY_HMAC_REQUIRED=${PROXY_HMAC_REQUIRED:-false}
      - PROXY_HMAC_KEYS=${PROXY_HMAC_KEYS:-}
      - PROXY_HMAC_PROXY_ID=${PROXY_HMAC_PROXY_ID:-}
      - PROXY_HMAC_SECRET=${PROXY_HMAC_SECRET:-}
      - PROXY_HMAC_MAX_SKEW_SECONDS=${PROXY_HMAC_MAX_SKEW_SECONDS:-60}
      - PROXY_HMAC_NONCE_TTL_SECONDS=${PROXY_HMAC_NONCE_TTL_SECONDS:-300}
    volumes:
      - ./php-app:/var/www/html
    command: >
      bash -lc "a2enmod rewrite &&
      mkdir -p /var/www/html/storage/logs /var/www/html/storage/framework/cache /var/www/html/storage/framework/sessions /var/www/html/storage/framework/views /var/www/html/storage/app/public /var/www/html/bootstrap/cache &&
      chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache &&
      chmod -R ug+rwx /var/www/html/storage /var/www/html/bootstrap/cache &&
      if [ ! -L /var/www/html/public/storage ]; then rm -rf /var/www/html/public/storage; php /var/www/html/artisan storage:link || true; fi &&
      sed -ri -e 's!/var/www/html(/public)*!/var/www/html/public!g'
      /etc/apache2/sites-available/*.conf
      /etc/apache2/apache2.conf
      /etc/apache2/conf-available/*.conf &&
      apache2-foreground"

  getaway:
    image: node:20-alpine
    container_name: getaway
    working_dir: /app/home-openwrt
    ports:
      - "3001:3000"
    environment:
      - PORT=3000
      - CLOUD_BASE_URL=http://server
      - CLOUD_HEALTH_PATH=/api/ping
      - CLOUD_REPORT_PATH=/api/controller/report
      - CLOUD_SETTINGS_PATH_TEMPLATE=/api/controllers/{id}/settings
      - HEARTBEAT_INTERVAL_MS=5000
      - CLOUD_REQUEST_TIMEOUT_MS=1500
      - STORAGE_PATH=/tmp/home-openwrt-storage
      - STORAGE_CHECK_INTERVAL_MS=10000
      - MANUAL_PINS=${MANUAL_PINS:-}
      - MANUAL_PIN_INVERT=${MANUAL_PIN_INVERT:-}
      - DEFAULT_SEND_INTERVAL_SECONDS=5
      - PROXY_HMAC_ENABLED=${PROXY_HMAC_ENABLED:-false}
      - PROXY_HMAC_PROXY_ID=${PROXY_HMAC_PROXY_ID:-}
      - PROXY_HMAC_SECRET=${PROXY_HMAC_SECRET:-}
    depends_on:
      - server
    volumes:
      - .:/app
    command: sh -c "mkdir -p /tmp/home-openwrt-storage && node src/server.js"

  db:
    image: mysql:8.0
    container_name: db
    environment:
      - MYSQL_DATABASE=smarthome
      - MYSQL_USER=smarthome
      - MYSQL_PASSWORD=smarthome
      - MYSQL_ROOT_PASSWORD=smarthome_root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/mysql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -psmarthome_root --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
